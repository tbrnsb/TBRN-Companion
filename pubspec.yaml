name: daily_companion
description: "A pocket companion for money and trips. Log expenses, track packing, and settle shared costs. Everything stays on your phone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  
  # Location & Geofencing
  geolocator: ^10.0.0
  
  # Local Database
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # UI & Charts
  fl_chart: ^0.65.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  share_plus: ^11.0.0
  flutter_local_notifications: ^19.4.0
  shared_preferences: ^2.2.2
  file_picker: ^10.3.10
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
