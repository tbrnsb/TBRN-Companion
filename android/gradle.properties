org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# Gradle's JVM used to inherit /tmp, which on this machine is a 3.6G tmpfs that
# the toolchain fills with multi-megabyte temporaries. `compressDebugAssets` then
# died with "Disk quota exceeded" and `flutter run` failed to produce an APK at
# all. The project disk has room, so the JVM is told to use it explicitly rather
# than relying on whatever TMPDIR happened to be exported.
